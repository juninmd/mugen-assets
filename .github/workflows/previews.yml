name: previews

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Every char/stage zip has a preview
        run: python tools/check_previews.py
      - name: Install preview dependencies
        run: pip install numpy pillow
      - name: Unit tests for the checker
        run: python -m unittest discover -s tools -p "test_*.py"
